services:
  sonos_panel:
    image: ghcr.io/almulder/sonos_panel:latest
    # build: .   # use this instead of `image:` for local development

    container_name: sonos_panel
    restart: unless-stopped

    # Persists config.json (the optional Line-In room override) across
    # container recreation/updates. Change the left side (host path) if
    # you want this stored somewhere other than the standard Unraid
    # appdata location -- the right side (container path) should stay
    # as-is, it matches DATA_DIR set in the Dockerfile.
    volumes:
      - /mnt/user/appdata/sonos-panel:/app/data

    # REQUIRED, not optional: Sonos discovery uses SSDP (UDP multicast)
    # to find speakers on the local network. Docker's default bridge
    # network isolates the container from the host's network segment,
    # which silently breaks discovery entirely -- the app will start
    # fine and just never find any speakers, with no obvious error.
    # Host networking shares the host's network stack directly, which
    # is what SSDP multicast actually needs.
    network_mode: host

    environment:
      # Change this if 3000 is already used by something else on your
      # server -- since this runs in host networking mode (no port
      # mapping/translation), the app listens directly on whatever
      # port you set here.
      - PORT=3000
      # Accent color (hex) used throughout the UI and the idle
      # screensaver's color-cycle animation. Any hex color works --
      # variations are derived from it automatically.
      - THEME_COLOR=#e8a33d
      # Seconds of no touch/click before the screensaver activates.
      - SCREENSAVER_TIMEOUT_SECONDS=600
      # Up to three extra tabs, each embedding another local dashboard
      # (Hubitat, Home Assistant, etc.) alongside the built-in Sonos
      # tab. A tab only shows up if its _URL is set -- leave all three
      # blank/commented out to just run with the single Sonos tab.
      # - TAB2_TITLE=Hubitat
      # - TAB2_COLOR=#4a90d9
      # - TAB2_URL=http://10.1.10.50/dashboard
      # - TAB3_TITLE=Home Assistant
      # - TAB3_COLOR=#41bdf5
      # - TAB3_URL=http://10.1.10.60:8123
      # - TAB4_TITLE=
      # - TAB4_COLOR=
      # - TAB4_URL=
