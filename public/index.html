<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Sonos Panel</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/app-icon.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#14181a" />
<!-- mobile-web-app-capable is the modern, cross-browser standard for
     "open fullscreen when added to the home screen"; apple-* variants
     are kept alongside it for older/other browser compatibility. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sonos Panel" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app">

    <div class="screensaver" id="screensaverOverlay" aria-hidden="true">
      <div class="screensaver__bounce" id="screensaverBounce">
        <div class="screensaver__art" id="screensaverArt"></div>
        <p class="screensaver__title" id="screensaverTitle"></p>
        <p class="screensaver__artist" id="screensaverArtist"></p>
      </div>
      <div class="screensaver__rings" id="screensaverRings">
        <svg viewBox="0 0 240 240" class="screensaver__ringsSvg" aria-hidden="true">
          <circle class="screensaver__ring screensaver__ring--1" cx="120" cy="120" r="24" />
          <circle class="screensaver__ring screensaver__ring--2" cx="120" cy="120" r="52" />
          <circle class="screensaver__ring screensaver__ring--3" cx="120" cy="120" r="80" />
          <circle class="screensaver__ring screensaver__ring--4" cx="120" cy="120" r="108" />
        </svg>
        <p class="screensaver__ringsLabel" id="screensaverRingsLabel"></p>
      </div>
    </div>

    <nav class="tabbar" id="tabBar" aria-label="Tabs"></nav>

    <div class="body">

      <main class="content" id="content">

        <section class="view view--sonos is-active" id="view-sonos" aria-hidden="false">
          <div class="sonostop" id="sonosSonostop">

            <div class="nowplaying" id="sonosNowPlaying">
              <button class="nowplaying__fullscreen-btn" id="sonosFullscreenBtn" aria-label="Full screen">&#x2922;</button>
              <div class="sleeptimer" id="sonosSleepTimerWrap">
                <button class="sleeptimer__btn" id="sonosSleepTimerBtn" aria-label="Sleep timer">
                  <img src="icons/sleep-timer.png" alt="" class="sleeptimer__icon" />
                  <span class="sleeptimer__badge" id="sonosSleepTimerBadge" style="display: none;"></span>
                </button>
              </div>
              <div class="nowplaying__art" id="sonosArt"></div>
              <div class="nowplaying__body">
                <div class="nowplaying__info">
                  <p class="nowplaying__eyebrow" id="sonosGroupLabel">SELECT A ROOM</p>
                  <p class="nowplaying__artist" id="sonosSourceLine" style="display: none;"></p>
                  <h2 class="nowplaying__title" id="sonosTitle">Nothing playing</h2>
                  <p class="nowplaying__artist" id="sonosArtist">&nbsp;</p>
                </div>
                <div class="progress">
                  <button class="progress__shuffle" id="sonosShuffleBtn" aria-label="Shuffle" aria-pressed="false">
                    <span class="progress__icon progress__icon--shuffle"></span>
                    <span class="progress__dot" id="sonosShuffleDot"></span>
                  </button>
                  <span class="progress__time" id="sonosElapsed">0:00</span>
                  <div class="progress__track" id="sonosProgressTrack">
                    <div class="progress__fill" id="sonosProgressFill"></div>
                  </div>
                  <span class="progress__time" id="sonosRemaining">-0:00</span>
                  <button class="progress__crossfade" id="sonosCrossfadeBtn" aria-label="Crossfade" aria-pressed="false">
                    <span class="progress__icon progress__icon--crossfade"></span>
                    <span class="progress__dot" id="sonosCrossfadeDot"></span>
                  </button>
                </div>
              </div>
              <div class="transport">
                <button class="transport__btn transport__btn--big" id="sonosPrev" aria-label="Previous">&#9198;</button>
                <button class="transport__btn transport__btn--main transport__btn--big" id="sonosPlayPause" aria-label="Play/Pause">&#9654;</button>
                <button class="transport__btn transport__btn--big" id="sonosNext" aria-label="Next">&#9197;</button>
              </div>
            </div>

          </div>

          <div class="lowerpanels">
            <div class="roomlist" id="sonosRoomlist">
              <div class="roomlist__header">
                <button class="roomlist__back" id="roomlistBackBtn" style="display: none;" aria-label="Back to rooms">&#8592;</button>
                <p class="roomlist__label" id="roomlistLabel">ROOMS &mdash; check to group</p>
                <button class="roomlist__addgroup" id="savedGroupsAddBtn" style="display: none;" aria-label="Save a new group">+</button>
              </div>
              <div class="roomlist__pullindicator" id="roomlistPullIndicator">Refreshing&hellip;</div>
              <ul class="roomlist__items" id="roomList"></ul>
            </div>


            <div class="sourcepanel" id="sourcePanel">
              <div class="sourcepanel__tabs">
                <button class="sourcepanel__tab is-active" id="srcTabSources">SOURCES</button>
                <button class="sourcepanel__tab" id="srcTabQueue">QUEUE</button>
              </div>
              <div class="sourcepanel__header">
                <button class="sourcepanel__back" id="sourceBackBtn" aria-label="Back">&#8592;</button>
                <p class="sourcepanel__title" id="sourcePanelTitle">SELECT A MUSIC SOURCE</p>
              </div>
              <div class="sourcepanel__search" id="sourceSearchWrap" style="display: none;">
                <input type="search" class="sourcepanel__searchinput" id="sourceSearchInput" placeholder="Search" autocomplete="off" />
                <button class="sourcepanel__searchclear" id="sourceSearchClear" aria-label="Clear search">&#10005;</button>
              </div>
              <ul class="sourcepanel__items" id="sourcePanelItems"></ul>
              <div class="queueview" id="queueView">
                <p class="queueview__info" id="queuePanelTitle">UP NEXT</p>
                <div class="queuepanel__actions">
                  <button class="queuepanel__actionbtn" id="queueSaveBtn">Save as playlist</button>
                  <button class="queuepanel__actionbtn queuepanel__actionbtn--danger" id="queueClearBtn">Clear queue</button>
                </div>
                <ul class="queuepanel__items" id="queuePanelItems"></ul>
              </div>
            </div>
          </div>
        </section>

      </main>

      <aside class="volrail" id="volRail" aria-label="Volume">
        <button class="volrail__mute" id="volMute" aria-label="Mute">&#128266;</button>
        <div class="volrail__track" id="volTrack">
          <div class="volrail__fill" id="volFill"></div>
          <div class="volrail__thumb" id="volThumb"></div>
        </div>
        <span class="volrail__value" id="volValue">--</span>
      </aside>

    </div>

  </div>

  <div class="sleepmenu" id="sonosSleepTimerOverlay" style="display: none;">
    <div class="sleepmenu__sheet">
      <p class="sleepmenu__label">SLEEP TIMER</p>
      <ul class="sleepmenu__list" id="sonosSleepTimerMenu"></ul>
    </div>
  </div>

  <div class="queueactions" id="queueActions" style="display: none;">
    <div class="queueactions__sheet">
      <p class="queueactions__label" id="queueActionsLabel"></p>
      <button class="queueactions__btn" data-mode="now">Play now</button>
      <button class="queueactions__btn" data-mode="next">Play next</button>
      <button class="queueactions__btn" data-mode="end">Add to queue</button>
      <button class="queueactions__btn queueactions__btn--cancel" id="queueActionsCancel">Cancel</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/volumeRail.js"></script>
  <script src="js/progressBar.js"></script>
  <script src="js/queuePanel.js"></script>
  <script src="js/sonosView.js"></script>
  <script src="js/screensaver.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
